  else if(k==="cfgcamp"){G.cfg.campPrice=val.trim()||"9,90";save();}
  else if(k==="llemh"){lraw().lembraH=val||"12:00";save();}
  else if(k==="erange"){const kk=e.target.dataset.k;sheet.draft[kk]=+val;$("o_"+kk).textContent=val;$("eOvr").innerHTML=editOvrText(sheet.draft);}
  else if(k==="pastetext"){sheet.text=val;clearTimeout(window._pv);window._pv=setTimeout(()=>{const pv=$("pastePrev");if(pv)pv.innerHTML=pastePreview(val);},250);}
  else if(k==="me"){S.me=val;save();render();}
  else if(k==="ptime"){S.pelada.time=val;save();}
  else if(k==="tempadmin"){if(!isOwner())return;S.tempAdminId=val||null;save();render();hud(val?"Admin da vez: "+adminName():"A administração voltou para você");}
  else if(k==="ename")sheet.draft.name=val;
  else if(k==="ebirth")sheet.draft.birth=val;
  else if(k==="eh")sheet.draft.h=+val||null;
  else if(k==="ew")sheet.draft.w=+val||null;
  else if(k==="wbirth"){sheet.w.birth=val;renderSheet();}
  else if(k==="wconsent"){sheet.w.consent=e.target.checked;renderSheet();}
  else if(k==="wh"||k==="ww"){sheet.w[k==="wh"?"h":"w"]=+val||null;sheet.w.body=null;
    const sel=e.target.id,pos=e.target.selectionStart;renderSheet();const n=$(sel);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}
});
document.addEventListener("change",async e=>{
  const f=e.target.dataset&&e.target.dataset.file;if(!f)return;const file=e.target.files&&e.target.files[0];if(!file)return;
  try{
    if(f==="uphoto"){const u=meU();const d=await compress(file,480,1);setUserPhoto(u,d);render();hud("Foto salva no seu perfil");}
    else if(f==="photo"){const p=byId(e.target.dataset.id);if(!canPhoto(p))return;const d=await compress(file,480,1);const pu=p.uid&&G.users.find(x=>x.id===p.uid);
      if(pu)setUserPhoto(pu,d);else{p.photo=p.photo||"ph_"+p.id;setImg(p.photo,d);save();}render();renderSheet();hud("Foto salva");}
    else if(f==="art"){const p=byId(e.target.dataset.id);const d=await compress(file,720,.75,.9,"image/png");p.art=p.art||"art_"+p.id;setImg(p.art,d);
      if(sheet&&sheet.w){sheet.w.selfies=[null,null,null];}save();render();openSheet({type:"player",id:p.id});hud("Personagem salvo · fotos do rosto descartadas");}
    else if(f==="selfie"){sheet.w.selfies[+e.target.dataset.i]=await compress(file,900);renderSheet();}
    else if(f==="uFront"||f==="uBack"){const key=f==="uFront"?"front":"back";const d=await compress(file,900);const ik=curP.code==="SP0001"?"u_"+key:"u_"+curP.code+"_"+key;S.uniform[key]=ik;setImg(ik,d);save();render();}
    else if(f==="proof"){const d=await compress(file,1100);const key="pf_"+uid();setImg(key,d);if(sheet){if(sheet.proof)setImg(sheet.proof,null);sheet.proof=key;renderSheet();}}
    else if(f==="uModel"){const d=await compress(file,1000);S.uniform.model=curP.code==="SP0001"?"u_model":"u_"+curP.code+"_model";setImg(S.uniform.model,d);save();render();renderSheet();hud("Uniforme 3D salvo");}
  }catch(err){hud("Não consegui abrir essa imagem");}
  e.target.value="";
});
$("notif").addEventListener("click",()=>{$("notif").classList.remove("show");});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();
  if(e.key==="Enter"){const t=e.target.id;if(["aName","aEmail","aPass"].includes(t)){e.preventDefault();document.querySelector('[data-act="authSubmit"]').click();}else if(t==="jCode"){e.preventDefault();document.querySelector('[data-act="findPelada"]').click();}}});
setInterval(()=>{if(S&&screen==="app"&&S.session&&!sheet&&(tab==="avaliar"||Date.now()>=S.session.closesAt))render();},30000);
setInterval(()=>{if(!S||!S.live)return;if(checkCap()){hud("Tempo esgotado!");try{navigator.vibrate&&navigator.vibrate([300,150,300]);}catch(e){}if(screen==="app"&&tab==="jogo"&&jogoSeg==="aovivo"&&!sheet)render();else fsRender();return;}const el=$("liveClock");if(el)el.textContent=mmss(liveElapsed());const e2=$("fsClock");if(e2&&!$("fs").hidden)e2.textContent=mmss(liveElapsed());},500);
(async function boot(){const m=(location.pathname+" "+location.hash).match(/convite\/?(SP\d{4,6})/i);if(m)pendingCode=m[1].toUpperCase();applyTheme();
  if(CLOUD){try{await cloudStart();}catch(e){return;}if(screen==="offline"||screen==="newpass")return;}
  const u=meU();
  if(u&&pendingCode){goHome("peladas");return;}
  if(u){if(G.sess.code&&pByCode(G.sess.code)){enterPelada(G.sess.code);return;}goHome(G.sess.mode||"peladas");return;}
  if(pendingCode){authMode="signup";screen="auth";}
  render();})();
